<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dokončení pozvánky</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f172a;
      font-family: Arial, sans-serif;
      color: white;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 430px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 24px;
      padding: 28px;
      box-sizing: border-box;
    }

    h1 {
      margin-top: 0;
      font-size: 30px;
    }

    p {
      color: #94a3b8;
      line-height: 1.5;
    }

    input {
      width: 100%;
      padding: 16px;
      margin-top: 10px;
      margin-bottom: 16px;
      border-radius: 12px;
      border: 1px solid #475569;
      background: #0f172a;
      color: white;
      font-size: 16px;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      padding: 16px;
      border: 0;
      border-radius: 12px;
      background: #ff5a1f;
      color: white;
      font-weight: bold;
      font-size: 17px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      margin-top: 16px;
      padding: 14px;
      border-radius: 12px;
      display: none;
    }

    .success {
      display: block;
      background: rgba(34, 197, 94, 0.15);
      border: 1px solid #22c55e;
    }

    .error {
      display: block;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid #ef4444;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>👋 Vítejte v týmu</h1>
    <p>Dokončete svůj účet nastavením vlastního hesla.</p>

    <label>Nové heslo</label>
    <input id="password" type="password" placeholder="Minimálně 8 znaků" />

    <label>Potvrdit heslo</label>
    <input id="passwordConfirm" type="password" placeholder="Zadejte heslo znovu" />

    <button id="activateBtn">Aktivovat účet</button>

    <div id="message" class="message"></div>
  </div>

<script>
  const SUPABASE_URL = "https://decpnnbaejxjbpmyjocs.supabase.co";

  // Sem dej STEJNÝ veřejný anon/publishable key,
  // který už používáš v dashboard.js nebo script.js.
  const SUPABASE_ANON_KEY = "sb_publishable_l6ko8NS_92RjQBM2rEzAvA_Sd2hYicb";
  const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );

  const btn = document.getElementById("activateBtn");
  const message = document.getElementById("message");

  function showMessage(text, type) {
    message.textContent = text;
    message.className = "message " + type;
  }

  btn.addEventListener("click", async () => {
    const password = document.getElementById("password").value;
    const passwordConfirm = document.getElementById("passwordConfirm").value;

    if (password.length < 8) {
      showMessage("Heslo musí mít alespoň 8 znaků.", "error");
      return;
    }

    if (password !== passwordConfirm) {
      showMessage("Hesla se neshodují.", "error");
      return;
    }

    btn.disabled = true;
    btn.textContent = "Aktivuji účet...";

    try {
      const { data, error } = await supabaseClient.auth.updateUser({
        password
      });

      if (error) {
        showMessage(error.message || "Účet se nepodařilo aktivovat.", "error");
        btn.disabled = false;
        btn.textContent = "Aktivovat účet";
        return;
      }

      showMessage(
        "✅ Účet je připraven. Přesměrovávám do administrace...",
        "success"
      );

      setTimeout(() => {
        window.location.href = "/dashboard.html";
      }, 1500);

    } catch (err) {
      showMessage("Něco se pokazilo. Zkuste to znovu.", "error");
      btn.disabled = false;
      btn.textContent = "Aktivovat účet";
    }
  });
</script>

</body>
</html>
