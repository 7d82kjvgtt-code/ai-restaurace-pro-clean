name: Pilot checks

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - '*.html'
      - '*.css'
      - 'vercel.json'
      - 'script.js'
      - 'dashboard.js'
      - 'restaurant-context.js'
      - 'dashboard-i18n.js'
      - 'supabase/migrations/**'
      - 'scripts/**'
      - 'tests/capacity/**'
      - '.github/workflows/pilot-checks.yml'
  pull_request:
    paths:
      - 'api/**'
      - '*.html'
      - '*.css'
      - 'vercel.json'
      - 'script.js'
      - 'dashboard.js'
      - 'restaurant-context.js'
      - 'dashboard-i18n.js'
      - 'supabase/migrations/**'
      - 'scripts/**'
      - 'tests/capacity/**'
      - '.github/workflows/pilot-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pilot-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-checks:
    name: Syntax, auth and tenant isolation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Check browser and API script syntax
        run: |
          node --check script.js
          node --check dashboard.js
          node --check dashboard-i18n.js
          node --check restaurant-context.js
          for api_file in api/*.js; do node --check "$api_file"; done
      - name: Install pinned local database fixture
        run: npm ci --prefix tests/capacity --ignore-scripts --no-audit --no-fund
      - name: Run offline API and tenant regression tests
        run: npm test --prefix tests/capacity
      - name: Verify backup failure boundaries and encrypted round trip with synthetic data
        env:
          RESTIC_TEST_BIN: ${{ runner.temp }}/restaurant-backup-tools/restic
        run: |
          python3 -m py_compile scripts/backup-restaurant.py scripts/install-backup-schedule.py
          python3 - <<'PY'
          import bz2, hashlib, os, pathlib, urllib.request
          archive = urllib.request.urlopen('https://github.com/restic/restic/releases/download/v0.18.1/restic_0.18.1_linux_amd64.bz2', timeout=60).read()
          expected = '680838f19d67151adba227e1570cdd8af12c19cf1735783ed1ba928bc41f363d'
          assert hashlib.sha256(archive).hexdigest() == expected, 'Unexpected restic archive hash'
          target = pathlib.Path(os.environ['RESTIC_TEST_BIN'])
          target.parent.mkdir(mode=0o700, parents=True, exist_ok=True)
          target.write_bytes(bz2.decompress(archive))
          target.chmod(0o700)
          PY
          python3 tests/capacity/backup-regression.py
