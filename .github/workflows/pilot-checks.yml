name: Pilot checks

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - '*.html'
      - '*.css'
      - 'vercel.json'
      - 'script.js'
      - 'dashboard.js'
      - 'restaurant-context.js'
      - 'dashboard-i18n.js'
      - 'supabase/migrations/**'
      - 'tests/capacity/**'
      - '.github/workflows/pilot-checks.yml'
  pull_request:
    paths:
      - 'api/**'
      - '*.html'
      - '*.css'
      - 'vercel.json'
      - 'script.js'
      - 'dashboard.js'
      - 'restaurant-context.js'
      - 'dashboard-i18n.js'
      - 'supabase/migrations/**'
      - 'tests/capacity/**'
      - '.github/workflows/pilot-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pilot-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-checks:
    name: Syntax, auth and tenant isolation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Check browser and API script syntax
        run: |
          node --check script.js
          node --check dashboard.js
          node --check dashboard-i18n.js
          node --check restaurant-context.js
          for api_file in api/*.js; do node --check "$api_file"; done
      - name: Install pinned local database fixture
        run: npm ci --prefix tests/capacity --ignore-scripts --no-audit --no-fund
      - name: Run offline API and tenant regression tests
        run: npm test --prefix tests/capacity
